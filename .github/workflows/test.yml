name: Testing CI

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: 'belfoot_fantasy_1_db'
          POSTGRES_USER: 'belfoot_root_1'
          POSTGRES_PASSWORD: "AhGhjIUHihiHH131HJHjhs*aDadx/Gcvmn#@%!#"
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m venv venv
        source venv/bin/activate
        ls        
        pip install -r requirements.txt
    - name: Creating packages
      run: |
        cd ..
        touch __init__.py
        cd ..
        touch __init__.py
        cd ..
        touch __init__.py
        cd /home/runner/work/belfoot_fantasy/
    - name: Create virtual environment
      run: |
        cd belfoot_fantasy/belfoot_fantasy
        touch env.py
        echo "import os" >> env.py
        echo "def set_env():" >> env.py
        echo "  os.environ['SECRET_KEY'] = 'django-insecure-+&!)jq^(5f64m+=$yg9c79v_b)wa2=#$8&16v7e58op_5wwrmb'" >> env.py
        echo "  os.environ['NAME'] = 'belfoot_fantasy_1_db'" >> env.py
        echo "  os.environ['USER'] = 'belfoot_root_1'" >> env.py
        echo "  os.environ['PASSWORD'] = 'AhGhjIUHihiHH131HJHjhs*aDadx/Gcvmn#@%!#'" >> env.py
        echo "  os.environ['HOST'] = '127.0.0.1'" >> env.py
        echo "  os.environ['PORT'] = '5432'" >> env.py
        
    - name: Make Migrations
      run: |
          source venv/bin/activate
          cd belfoot_fantasy
          python manage.py makemigrations
          python manage.py migrate
          cd ..

    - name: Run Tests
      run: |
        source venv/bin/activate        
