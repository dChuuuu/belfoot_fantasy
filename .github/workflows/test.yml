name: Testing CI

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create virtual environment
      run: |
        touch belfoot_fantasy/belfoot_fantasy/env.py
        
    - name: Run Tests
      run: |
        cd /apps/users
        pytest tests.py


